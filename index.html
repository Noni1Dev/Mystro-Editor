<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Denied | Mystro Design</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: url('../Mystro-Editor/Local/Background.webp') no-repeat center center fixed;
      background-size: cover;
      color: white;
      padding: 20px;
      overflow-x: hidden;
    }
    
    .glass-panel {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
    }
    
    .pulse-animation {
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
      }
      70% {
        transform: scale(1.05);
        box-shadow: 0 0 0 10px rgba(239, 68, 68, 0);
      }
      100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
      }
    }
  </style>
</head>
<body class="bg-slate-900 text-white">
  <div class="max-w-7xl mx-auto px-4">
    <!-- Logo -->
    <img alt="logo" height="79" src="../Mystro-Editor/Local/DownloadComputerGames.png" title="logo" width="330" class="mx-auto mb-10">
    
    <div class="max-w-4xl mx-auto flex flex-col items-center justify-center min-h-[calc(100vh-180px)]">
    <div class="glass-panel p-10 text-center pulse-animation">
      <div class="text-6xl mb-6 text-red-500">
        <i class="fas fa-ban"></i>
      </div>
      <h1 class="text-4xl font-bold mb-4">ACCESS DENIED - تم النيك</h1>
      <h2 class="text-2xl font-semibold mb-6 text-red-400">You are banned from using this website</h2>
      
      <div class="bg-red-900/30 border border-red-700 rounded-lg p-4 mb-6">
        <p class="mb-2">Your account has been permanently suspended due to violation of Noni's terms of service.</p>
        <p class="text-sm opacity-80">Ban reference: نيك مك</p>
      </div>
      
      
      <div class="mt-8 pt-6 border-t border-slate-700">
        <p class="text-sm opacity-70">
          <i class="fas fa-info-circle mr-1"></i> ديرو ديزاين لزبي
        </p>
      </div>
    </div>
    
    <div class="mt-8 text-center text-sm opacity-50">
      <p>© 2025 Mystro Design. All rights reserved.</p>
    </div>
  </div>
</body>
</html>
